    <script>
      // Clear old cached service workers on localhost from previous apps (e.g. IT Audit app)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
      }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 font-['Plus_Jakarta_Sans',sans-serif] antialiased selection:bg-cyan-500 selection:text-white min-h-screen">

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
